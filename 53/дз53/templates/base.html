<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<header class="top">
    <a class="logo" href="{{ url_for('index') }}">Финансы студента</a>
    <nav>
        {% for item in menu %}
            <a class="{% if active == item.endpoint %}active{% endif %}" href="{{ url_for(item.endpoint) }}">{{ item.title }}</a>
        {% endfor %}
    </nav>
</header>
<main>
    {% block content %}{% endblock %}
</main>
<footer>
    <p>Домашние задание по Flask, {{ year }}</p>
</footer>
</body>
</html>
